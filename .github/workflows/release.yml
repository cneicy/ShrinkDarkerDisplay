name: Release
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        type: choice
        options: [patch, minor, major]
        default: patch
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Bump version
        id: version
        shell: pwsh
        env:
          BUMP_PART: ${{ inputs.bump || 'patch' }}
        run: |
          $version = ./scripts/Bump-Version.ps1 -Part $env:BUMP_PART
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build signed installer
        shell: pwsh
        run: ./scripts/Build-Installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ steps.version.outputs.value }}
          path: artifacts/installer/ShrinkDarkerDisplay-Setup-x64.exe
          if-no-files-found: error
      - name: Commit version and tag
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Version.props
          git commit -m "chore: release v$env:RELEASE_VERSION"
          git tag "v$env:RELEASE_VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$env:RELEASE_VERSION"
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = "v$env:RELEASE_VERSION"
          gh release create $tag --verify-tag --draft --title $tag --generate-notes
          gh release upload $tag 'artifacts/installer/ShrinkDarkerDisplay-Setup-x64.exe'
          gh release edit $tag --draft=false --latest
